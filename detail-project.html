<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Project - Rifki Alfatah Design</title>
</head>

<body>

    <header>

        <h1>Rifki Alfatah Design</h1>

        <nav>
            <a href="tugasindividu.html">Beranda</a>
            <a href="tambah_project.html">Tambah Project</a>
            <a href="detail-project.html">Detail Project</a>
        </nav>

    </header>


    <main>

        <section>

            <h2>Tambah Project</h2>

            <p>
                Gunakan form berikut untuk menambahkan karya desain baru.
            </p>


            <form>

                <p>
                    <label for="nama-project">
                        Nama Project
                    </label>

                    <input
                        type="text"
                        id="nama-project"
                        name="nama-project"
                    >
                </p>


                <p>
                    <label for="kategori">
                        Kategori
                    </label>

                    <select
                        id="kategori"
                        name="kategori"
                    >

                        <option value="">
                            Pilih kategori
                        </option>

                        <option value="poster">
                            Poster
                        </option>

                        <option value="banner">
                            Banner
                        </option>

                        <option value="sosial-media">
                            Sosial Media
                        </option>

                    </select>
                </p>


                <p>
                    <label for="deskripsi">
                        Deskripsi Project
                    </label>
                </p>

                <p>
                    <textarea
                        id="deskripsi"
                        name="deskripsi"
                        rows="5"
                        cols="40"
                    ></textarea>
                </p>


                <p>
                    <label for="tahun">
                        Tahun
                    </label>

                    <input
                        type="number"
                        id="tahun"
                        name="tahun"
                    >
                </p>


                <p>
                    <label for="tools">
                        Tools yang digunakan
                    </label>

                    <input
                        type="text"
                        id="tools"
                        name="tools"
                    >
                </p>


                <p>
                    <button type="submit">
                        Simpan Project
                    </button>
                </p>

            </form>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 Rifki Alfatah Design
        </p>

    </footer>

</body>

</html>
